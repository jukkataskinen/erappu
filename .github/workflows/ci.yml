name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      AUTH_MODE: dev
      DB_DRIVER: pglite
      HTJ_MODE: mock
      ESINETTI_MODE: mock
      EMAIL_MODE: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # Henkilötunnusvahti: koodissa, testeissä tai skripteissä ei saa olla
      # henkilötunnuksen muotoisia merkkijonoja (sallittu vain testien
      # tunnettu kuvitteellinen esimerkki 131052-308T).
      - name: Henkilötunnusvahti
        run: |
          if grep -rEn --include='*.ts' --include='*.tsx' --include='*.mts' --include='*.sql' '\b[0-3][0-9][01][0-9][0-9]{2}[-+A-FUVWXY][0-9]{3}[0-9A-Y]\b' src scripts supabase tests | grep -v '131052-308T'; then
            echo "Mahdollinen henkilötunnus koodissa"; exit 1; fi
      - run: npm audit --audit-level=high || true
